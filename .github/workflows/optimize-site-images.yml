name: One-time Brown Family Apps image optimization

on:
  push:
    paths:
      - ".github/workflows/optimize-site-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create optimized WebP assets and update references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          def webp(src, dst, quality=88, max_side=None):
              src, dst = Path(src), Path(dst)
              im = Image.open(src)
              if max_side and max(im.size) > max_side:
                  im.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
              params = dict(format="WEBP", quality=quality, method=6)
              if "icc_profile" in im.info:
                  params["icc_profile"] = im.info["icc_profile"]
              im.save(dst, **params)
              print(f"{src}: {src.stat().st_size:,} -> {dst}: {dst.stat().st_size:,} bytes; {im.size}")

          webp("assets/apps/serviceall-feature.png", "assets/apps/serviceall-feature.webp", 88)
          webp("assets/apps/void-ascendant-feature.png", "assets/apps/void-ascendant-feature.webp", 88)
          webp("assets/apps/tictactoe-icon.webp", "assets/apps/tictactoe-icon-optimized.webp", 90, 768)
          webp("assets/apps/tictactoe-game-landscape.webp", "assets/apps/tictactoe-game-landscape-optimized.webp", 88, 1800)

          replacements = {
              "/assets/apps/serviceall-feature.png": "/assets/apps/serviceall-feature.webp",
              "/assets/apps/void-ascendant-feature.png": "/assets/apps/void-ascendant-feature.webp",
              "/assets/apps/tictactoe-game-landscape.webp": "/assets/apps/tictactoe-game-landscape-optimized.webp",
          }

          for filename in ["index.html", "serviceall.html", "void-ascendant.html"]:
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          p = Path("tictactoe.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace("/assets/apps/tictactoe-icon.webp", "/assets/apps/tictactoe-icon-optimized.webp")
          text = text.replace("/assets/apps/tictactoe-game-landscape.webp", "/assets/apps/tictactoe-game-landscape-optimized.webp")
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Brown Family Apps Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/apps/*.webp index.html serviceall.html tictactoe.html void-ascendant.html
          git commit -m "Optimize website image payloads"
          git push
